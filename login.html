<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Inicio de sesión en AyudaYa, la plataforma de reporte de necesidades comunitarias de Guayaquil.">
  <title>AyudaYa — Iniciar Sesión</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    /* Asegurar que el fondo del login sea completo en la página */
    body {
      padding-bottom: 0;
    }
  </style>
</head>
<body>

  <!-- Alerta flotante para simulación -->
  <div id="toast-msg" class="toast toast-success">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
      <polyline points="22 4 12 14.01 9 11.01"></polyline>
    </svg>
    <span id="toast-text">Sesión iniciada con éxito. Redirigiendo...</span>
  </div>

  <main class="login-wrapper">
    <div class="login-card">
      <header class="login-header">
        <div class="brand-logo">
          <!-- Escudo de protección / comunidad -->
          <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          </svg>
          <span class="brand-name">AyudaYa</span>
        </div>
        <h1 class="login-title">Ingresar</h1>
        <p class="login-subtitle">Gestión comunitaria para Guayaquil</p>
      </header>

      <form id="login-form" novalidate>
        <!-- Campo Usuario -->
        <div class="form-group" id="group-user">
          <label class="form-label" for="username">Usuario o Correo</label>
          <input type="text" id="username" class="form-control" placeholder="Ej. LiderVecinal01" required>
          <span class="form-error-msg" style="display: none;" id="error-user">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            Por favor, ingresa tu usuario.
          </span>
        </div>

        <!-- Campo Contraseña -->
        <div class="form-group" id="group-pass">
          <label class="form-label" for="password">Contraseña</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
          <span class="form-error-msg" style="display: none;" id="error-pass">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            Ingresa tu contraseña de acceso.
          </span>
        </div>

        <div class="login-actions">
          <button type="submit" class="btn btn-primary" id="btn-submit">Ingresar</button>
          
          <a href="#" id="link-create-account" class="btn btn-secondary" style="text-decoration: none;">Crear cuenta</a>
        </div>
      </form>
    </div>
  </main>

  <script>
    document.getElementById('login-form').addEventListener('submit', function(event) {
      event.preventDefault();
      
      const userField = document.getElementById('username');
      const passField = document.getElementById('password');
      const groupUser = document.getElementById('group-user');
      const groupPass = document.getElementById('group-pass');
      const errorUser = document.getElementById('error-user');
      const errorPass = document.getElementById('error-pass');
      
      let isValid = true;
      
      // Validación de usuario
      if (!userField.value.trim()) {
        groupUser.classList.add('has-error');
        errorUser.style.display = 'flex';
        isValid = false;
      } else {
        groupUser.classList.remove('has-error');
        errorUser.style.display = 'none';
      }
      
      // Validación de contraseña
      if (!passField.value.trim()) {
        groupPass.classList.add('has-error');
        errorPass.style.display = 'flex';
        isValid = false;
      } else {
        groupPass.classList.remove('has-error');
        errorPass.style.display = 'none';
      }
      
      if (isValid) {
        // Simular inicio de sesión exitoso y redirección
        const toast = document.getElementById('toast-msg');
        toast.classList.add('show');
        
        setTimeout(() => {
          window.location.href = 'reportes.html';
        }, 1200);
      }
    });

    // Simular "Crear cuenta"
    document.getElementById('link-create-account').addEventListener('click', function(event) {
      event.preventDefault();
      
      const toast = document.getElementById('toast-msg');
      const toastText = document.getElementById('toast-text');
      
      toast.classList.remove('toast-success');
      toast.style.backgroundColor = 'var(--color-primary)';
      toastText.textContent = 'Simulación: Flujo de creación de cuenta iniciado.';
      toast.classList.add('show');
      
      setTimeout(() => {
        toast.classList.remove('show');
        // Devolver estado a por defecto después de ocultar
        setTimeout(() => {
          toast.classList.add('toast-success');
          toast.style.backgroundColor = '';
          toastText.textContent = 'Sesión iniciada con éxito. Redirigiendo...';
        }, 400);
      }, 2000);
    });
  </script>
</body>
</html>
