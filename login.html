<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Inicio de sesión en BrigadaSalud — Panel del Coordinador.">
  <title>BrigadaSalud — Iniciar sesión</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <main class="auth-wrapper">
    <div class="auth-card">
      <header class="auth-header">
        <div class="auth-brand">
          <span class="material-symbols-rounded">medical_services</span>
          <span class="auth-brand-name">BrigadaSalud</span>
        </div>
        <h1 class="auth-title">Iniciar sesión</h1>
        <p class="auth-subtitle">Panel del Coordinador — Brigadas médicas comunitarias</p>
      </header>

      <form id="login-form" novalidate>
        <div class="form-group" id="group-user">
          <label class="form-label" for="username">Usuario o correo</label>
          <input type="text" id="username" class="form-control" placeholder="coordinador@brigadasalud.org" autocomplete="username">
          <span class="form-error-msg" id="error-user" hidden>Por favor, ingresa tu usuario o correo.</span>
        </div>

        <div class="form-group" id="group-pass">
          <label class="form-label" for="password">Contraseña</label>
          <div class="input-with-icon">
            <input type="password" id="password" class="form-control" placeholder="••••••••" autocomplete="current-password">
            <button type="button" class="material-symbols-rounded" data-toggle-password="password" aria-label="Mostrar contraseña">visibility</button>
          </div>
          <span class="form-error-msg" id="error-pass" hidden>Ingresa tu contraseña de acceso.</span>
        </div>

        <div class="form-group has-error" id="group-credentials" hidden>
          <span class="form-error-msg">
            <span class="material-symbols-rounded" style="font-size:16px">error</span>
            Credenciales inválidas. Verifica tu usuario y contraseña.
          </span>
        </div>

        <div class="auth-actions">
          <button type="submit" class="btn btn-primary btn-block">Iniciar sesión</button>
          <a href="recuperar-password.html" class="auth-link">¿Olvidaste tu contraseña?</a>
        </div>
      </form>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();
      const groupUser = document.getElementById('group-user');
      const groupPass = document.getElementById('group-pass');
      const groupCred = document.getElementById('group-credentials');
      let valid = true;

      groupUser.classList.toggle('has-error', !user);
      document.getElementById('error-user').hidden = !!user;
      groupPass.classList.toggle('has-error', !pass);
      document.getElementById('error-pass').hidden = !!pass;
      groupCred.hidden = true;

      if (!user || !pass) valid = false;

      if (valid && user === 'demo' && pass === 'error') {
        groupCred.hidden = false;
        valid = false;
      }

      if (valid) {
        showToast('Sesión iniciada correctamente');
        setTimeout(() => {
          window.location.href = user.includes('medico') ? 'seleccion-rol.html' : 'dashboard.html';
        }, 800);
      }
    });
  </script>
</body>
</html>
