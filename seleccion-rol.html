<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrigadaSalud — Selección de rol</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <main class="auth-wrapper">
    <div class="auth-card">
      <header class="auth-header">
        <div class="auth-brand">
          <span class="material-symbols-rounded">medical_services</span>
          <span class="auth-brand-name">BrigadaSalud</span>
        </div>
        <h1 class="auth-title">Selecciona tu rol</h1>
        <p class="auth-subtitle">Tu cuenta tiene acceso a más de un panel</p>
      </header>

      <div class="role-cards">
        <a href="dashboard.html" class="role-card">
          <div class="role-card-icon">
            <span class="material-symbols-rounded">dashboard</span>
          </div>
          <div>
            <strong>Coordinador</strong>
            <p style="font-size:var(--font-size-small);color:var(--color-text-muted)">Gestión de brigadas, pacientes y reportes</p>
          </div>
        </a>
        <a href="dashboard.html" class="role-card">
          <div class="role-card-icon" style="background:var(--color-secondary-light);color:var(--color-secondary)">
            <span class="material-symbols-rounded">stethoscope</span>
          </div>
          <div>
            <strong>Médico</strong>
            <p style="font-size:var(--font-size-small);color:var(--color-text-muted)">Atención de turnos y registro clínico</p>
          </div>
        </a>
      </div>
    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
